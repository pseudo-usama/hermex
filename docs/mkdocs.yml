site_name: Hermex
site_url: https://hermex.usama.ai/
site_description: Drive ChatGPT and Gemini from Python — no API keys, no billing, just the free web UI.
repo_url: https://github.com/pseudo-usama/hermex
repo_name: pseudo-usama/hermex

# content/index.html is the landing page — mkdocs copies non-Markdown files verbatim,
# so it lands at /, while content/docs/ becomes /docs/.
docs_dir: content

theme:
  name: material
  custom_dir: overrides
  logo: docs/assets/logo.svg
  favicon: docs/assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - toc.permalink
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tooltips

markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".."]
      check_paths: true
  - admonition
  - pymdownx.details

# target="_self" makes navigation.instant skip this link; without it the swap throws on
# the landing page's read-only <use href="#..."> and the docs page never goes away.
copyright: Copyright &copy; 2026 Usama &middot; <a href="/" target="_self">Home</a>

extra:
  homepage: docs/  # logo stays in the docs; relative so it also resolves on localhost
  analytics:
    provider: google
    property: G-SLP99EGEE2
  social:
    - icon: material/language-python
      link: https://pypi.org/project/hermex
      name: Hermex on PyPI
    - icon: fontawesome/brands/github
      link: https://github.com/pseudo-usama/hermex
      name: Hermex on GitHub
    - icon: material/auto-fix
      link: https://watermark.usama.ai
      name: Gemini Watermark Remover

extra_css:
  - docs/stylesheets/extra.css

plugins:
  - search
  - social:
      cards_layout: hermex
  - mkdocstrings:
      handlers:
        python:
          paths: [..]  # `import hermex` resolves
          options:
            show_source: false
            show_bases: true
            show_root_heading: true
            show_symbol_type_toc: true
            show_symbol_type_heading: true
            members_order: source
            docstring_style: sphinx

nav:
  - Home: docs/index.md
  - Installation: docs/installation.md
  - Quickstart: docs/quickstart.md
  - Guides:
    - Gemini: docs/guides/gemini.md
    - ChatGPT: docs/guides/chatgpt.md
  - API Reference:
    - Shared Interface: docs/api/shared-interface.md
    - Gemini: docs/api/gemini.md
    - ChatGPT: docs/api/chatgpt.md
    - Models: docs/api/models.md
    - Exceptions: docs/api/exceptions.md
  - Changelog: docs/changelog.md
